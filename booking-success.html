<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Island Vibes - Booking Confirmed</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat fixed;">

    <!-- Clean Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark bg-opacity-75 backdrop-blur shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span class="fs-4 me-2">🌴</span> <strong>Island Vibes</strong>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="explore.html">Explore</a></li>
                    <li class="nav-item" id="auth-nav-item"><a class="nav-link" href="register.html">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Success Container -->
    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg border-0 rounded-5 text-center p-4 p-md-5 bg-white bg-opacity-95 backdrop-blur">

                    <!-- Celebration Icon Badge -->
                    <div class="mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-2p text-warning rounded-circle shadow-sm" style="width: 80px; height: 80px; font-size: 2.5rem;">
                            🎉
                        </div>
                    </div>

                    <!-- Heading -->
                    <h2 class="fw-bold mb-3 display-6 text-dark">Ticket Reserved!</h2>

                    <!-- Dynamic Message Box -->
                    <p class="text-secondary lead fs-6 mb-4 px-lg-3" id="confirmation-message">
                        Your festival pass has been securely reserved. Check your email for details.
                    </p>

                    <!-- Call to Action Buttons -->
                    <div class="d-grid gap-3 d-sm-flex justify-content-sm-center mt-2">
                        <a href="index.html" class="btn btn-dark btn-lg px-4 fw-bold rounded-pill shadow-sm">Return to Home</a>
                        <a href="explore.html" class="btn btn-outline-dark btn-lg px-4 fw-bold rounded-pill shadow-sm">Explore More Events</a>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark bg-opacity-85 text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0 text-light opacity-75">&copy; 2026 Island Vibes. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
                // Dynamically pull user details from localStorage
                document.addEventListener("DOMContentLoaded", () => {
                    const userName = localStorage.getItem("islandVibesUser") || "Valued Member";
                    const msgEl = document.getElementById("confirmation-message");
                    msgEl.innerHTML = `Thank you, <strong class="text-dark">${userName}</strong>! Your festival pass has been successfully reserved. Check your email for booking details and entry instructions.`;
                });
    </script>
</body>
</html>
